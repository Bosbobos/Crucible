><path d="M660 305V365" class="line" marker-end="url(#arrow)"/><rect x="545" y="370" width="230" height="80" rx="8" class="box"/><text x="561" y="401">PostgreSQL · learning</text><text x="561" y="428" class="small">Свои role / volume / outbox</text><path d="M660 450V535" class="line" marker-end="url(#arrow)"/><path d="M660 140V170H915V215" class="line" marker-end="url(#arrow)"/><rect x="800" y="220" width="230" height="85" rx="8" class="box"/><text x="815" y="251">reports-service</text><text x="815" y="279" class="small">Экспорт и задания</text><path d="M915 305V365" class="line" marker-end="url(#arrow)"/><rect x="800" y="370" width="230" height="80" rx="8" class="box"/><text x="816" y="401">PostgreSQL · reports</text><text x="816" y="428" class="small">Свои role / volume / outbox</text><path d="M915 450V535" class="line" marker-end="url(#arrow)"/><path d="M660 140V170H1170V215" class="line" marker-end="url(#arrow)"/><rect x="1055" y="220" width="230" height="85" rx="8" class="box"/><text x="1070" y="251">character-service</text><text x="1070" y="279" class="small">Косметический путь</text><path d="M1170 305V365" class="line" marker-end="url(#arrow)"/><rect x="1055" y="370" width="230" height="80" rx="8" class="box"/><text x="1071" y="401">PostgreSQL · character</text><text x="1071" y="428" class="small">Свои role / volume / outbox</text><path d="M1170 450V535" class="line" marker-end="url(#arrow)"/><rect x="35" y="540" width="1250" height="65" rx="8" class="box"/><text x="65" y="579">RabbitMQ · study.events · publisher confirms → quorum queues → inbox → receipt / projections</text><text x="40" y="661">practice → learning, reports, character · content campaign → character</text><text x="40" y="695">learning review obligations → practice · learning profile settings → character · character → reports</text><text x="40" y="742" class="small">Чужие SQL-соединения запрещены. RPG недоступен: попытка и outbox сохраняются у practice.</text><text x="40" y="773" class="small">Runtime LLM не требуется. MCP-агент создаёт комментарии и предложения; исправление подтверждает владелец через UI.</text></svg>
