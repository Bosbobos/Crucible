statement: Let $f:[0,1]\to[0,1]$ be continuous. Prove that $f(c)=c$ for some $c\in[0,1]$.
solution: $g(x)=f(x)-x$ is continuous, $g(0)=f(0)\ge0$, $g(1)=f(1)-1\le0$. By the intermediate-value theorem $g(c)=0$ for some $c\in[0,1]$.
remember: '**«Show that $f(c)=h(c)$ for some $c$»** → IVT for $g=f-h$; check the signs at the ends (allow equality there).'
