statement: Compute the determinant of the $n\times n$ matrix with entries $a_{ij}=\min(i,j)$.
solution: Row $k$ is $(1,2,\dots,k-1,k,k,\dots,k)$. Then $R_k-R_{k-1}=(0,\dots,0,1,1,\dots,1)$ with the first $1$ in position $k$. After these operations (from the bottom up) the matrix is upper triangular with ones on the diagonal, so $\det=1$.
remember: '**Structured matrix with growing rows** → subtract neighbouring rows to expose a triangular shape. Check on $n=2$: $\det\begin{pmatrix}1&1\\1&2\end{pmatrix}=1$.'
hints:
- 'Elementary row operations: subtract each row from the next one, starting from the bottom.'
- After $R_k\to R_k-R_{k-1}$ for $k=n,\dots,2$ the matrix becomes upper triangular with ones on the diagonal.
- Determinants, row operations — Axler, ch. 10.
