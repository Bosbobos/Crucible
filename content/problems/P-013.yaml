statement: Solve $y'=xy^2$, $y(0)=1$. On what interval does the solution exist?
solution: '$-\frac1y=\frac{x^2}2-1\Rightarrow y=\dfrac{2}{2-x^2}$. It blows up at $x=\pm\sqrt2$, so the solution through $(0,1)$ exists on $(-\sqrt2,\sqrt2)$.

  (Dividing by $y^2$ was legitimate: $y\equiv0$ is the other solution, but it does not satisfy $y(0)=1$.)'
remember: '**Separable:** $y''=f(x)g(y)$ → $\int\frac{dy}{g(y)}=\int f\,dx$. Do not forget the solutions $g(y)=0$ lost by dividing, and the **interval of existence**.'
hints:
- 'Separate the variables: $\frac{dy}{y^2}=x\,dx$.'
- $-\frac1y=\frac{x^2}2+C$; the initial condition gives $C=-1$.
- 📘 Сначала — [ядро темы «Уравнения первого порядка»](study-material:vault-first-order). Separable equations — Arnold, ODE, ch. 1; the MIT ODE course, lecture 1.
