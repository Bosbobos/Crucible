statement: 'Let $X$ be the number of independent trials up to and including the first success, each trial succeeding with probability $p\in(0,1)$.

  (a) Find $P(X>n)$ and show that $P(X>m+n\mid X>m)=P(X>n)$ for all integers $m,n\ge0$.

  (b) Find $E X$ in two ways: from the series, and by conditioning on the first trial.'
solution: '(a) $P(X>n)=(1-p)^n$, so $P(X>m+n\mid X>m)=\dfrac{(1-p)^{m+n}}{(1-p)^m}=(1-p)^n$.

  (b) $E X=\sum_{n\ge0}P(X>n)=\sum(1-p)^n=\frac1p$. First step: with probability $p$ we stop after 1 trial; otherwise we have used 1 trial and start afresh: $E X=1+(1-p)E X$, so $E X=\frac1p$.'
remember: The geometric distribution is the **only memoryless** discrete one; its continuous analogue is the exponential. $E X=\sum_{n\ge0}P(X>n)$ for $X\ge0$ integer.
hints:
- '$X>n$ means: the first $n$ trials all failed.'
- '$P(X>n)=(1-p)^n$. For (b), first step: $E X=1+(1-p)E X$.'
- Geometric distribution — Blitzstein–Hwang, 4.3; conditional expectation, 9.1.
