statement: 'Compute:

  (a) $\displaystyle\int_0^\infty\sqrt x\,e^{-x}\,dx$;

  (b) $\displaystyle\int_{-\infty}^\infty x^2e^{-x^2/2}\,dx$.

  You may use $\int_{-\infty}^\infty e^{-x^2}dx=\sqrt\pi$.'
solution: '(a) By parts, $\int_0^\infty x^{1/2}e^{-x}dx=\frac12\int_0^\infty x^{-1/2}e^{-x}dx$; with $x=t^2$ this is $\frac12\int_{-\infty}^\infty e^{-t^2}dt=\frac{\sqrt\pi}2$. (That is $\Gamma(\frac32)$.)

  (b) By parts: $\int_{-\infty}^\infty x^2e^{-x^2/2}dx=\int_{-\infty}^\infty e^{-x^2/2}dx=\sqrt{2\pi}$ — the variance of $N(0,1)$ is 1.'
remember: $\Gamma(s)=\int_0^\infty x^{s-1}e^{-x}dx$, $\Gamma(s+1)=s\Gamma(s)$, $\Gamma(\frac12)=\sqrt\pi$. Moments of $e^{-x^2/2}$ → parts with $dv=xe^{-x^2/2}dx$.
hints:
- (a) Integrate by parts, or substitute $x=t^2$. (b) Integrate by parts with $u=x$, $dv=xe^{-x^2/2}dx$.
- (a) $\int_0^\infty\sqrt xe^{-x}dx=\frac12\int_0^\infty x^{-1/2}e^{-x}dx$, and $x=t^2$ gives $\int_{-\infty}^\infty e^{-t^2}dt$. (b) $\int x\cdot xe^{-x^2/2}=\left[-xe^{-x^2/2}\right]+\int e^{-x^2/2}$.
- The Gamma function, Gaussian integral — Spivak, ch. 19; Blitzstein–Hwang, 5.4, 8.4.
