statement: Two friends arrive at a café independently, each at a uniformly random moment between 12:00 and 13:00. Each waits 15 minutes for the other and then leaves. Find the probability that they meet.
solution: In the square $[0,60]^2$ the complement $|x-y|>15$ is two triangles of total area $45^2$. So $P=1-\left(\frac{45}{60}\right)^2=\frac7{16}$.
remember: '**Two independent uniform times** → a uniform point in a square; the probability is an area ratio. The complement is often easier.'
hints:
- The pair of arrival times is a uniform point in a square; draw the region $|x-y|\le15$.
- The complement consists of two right triangles with legs $45$.
- Geometric probability — Blitzstein–Hwang, 7.1.
