statement: 'Prove that for $0<a<b$

  $$\frac{b-a}b<\ln\frac ba<\frac{b-a}a.$$'
solution: By the MVT, $\ln b-\ln a=\frac1c(b-a)$ with $a<c<b$. Since $\frac1b<\frac1c<\frac1a$ and $b-a>0$, the inequalities follow.
remember: '**Bound a difference $f(b)-f(a)$** → MVT, then bound $f''$ on the interval.'
