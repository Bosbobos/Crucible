statement: Find $\displaystyle\lim_{x\to0}\frac{(1+x)^{1/x}-e}x$.
solution: $(1+x)^{1/x}=e\cdot e^{-x/2+o(x)}=e-\frac e2x+o(x)$, so the limit is $-\frac e2$.
remember: '**Limits around $e$** → $f^g=e^{g\ln f}$, expand the exponent one order further than needed for the limit itself.'
hints:
- Write $(1+x)^{1/x}=e^{\ln(1+x)/x}$ and expand the exponent.
- $\frac{\ln(1+x)}x=1-\frac x2+o(x)$, so $(1+x)^{1/x}=e\cdot e^{-x/2+o(x)}=e\left(1-\frac x2\right)+o(x)$.
