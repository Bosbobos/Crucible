statement: A stick of length 1 is broken at a uniformly random point; the left piece is kept and broken again at a uniformly random point of it. Find the expected length of the final left piece.
solution: $E Y=E[E[Y\mid X]]=E\frac X2=\frac14$.
remember: '**Nested randomness** → $E Y=E[E[Y\mid X]]$; no need for the distribution of $Y$ (its density is $-\ln y$, but we never used it).'
hints:
- Condition on the first break point $X$.
- Given $X=x$, the second piece is uniform on $[0,x]$, so $E[Y\mid X]=\frac X2$.
- Conditional expectation — Blitzstein–Hwang, 9.1–9.3.
