statement: 'Let $U_1,\dots,U_n$ be i.i.d. uniform on $[0,1]$.

  (a) Find the CDF and the expectation of $M=\max U_i$.

  (b) Find the expectation of $m=\min U_i$.'
solution: '(a) $F_M(t)=t^n$ on $[0,1]$, density $nt^{n-1}$, $E M=\int_0^1nt^n\,dt=\frac n{n+1}$.

  (b) $E m=\int_0^1P(m>t)\,dt=\int_0^1(1-t)^n\,dt=\frac1{n+1}$.'
remember: '**Max/min of independent variables** → CDF of max is the product of CDFs, survival of min is the product of survivals. $E X=\int_0^\infty P(X>t)\,dt$ for $X\ge0$.'
hints:
- $\max\le t$ iff all are $\le t$; $\min>t$ iff all are $>t$.
- $P(M\le t)=t^n$, $P(m>t)=(1-t)^n$. For $E$ use the density or $E X=\int_0^1P(X>t)\,dt$.
- Order statistics — Blitzstein–Hwang, 8.6.
