statement: Compute (a) $\displaystyle\int_0^{\pi/2}\sin^4x\,dx$; (b) $\displaystyle\int_0^\infty x^4e^{-x}\,dx$.
solution: '(a) The cosines integrate to $0$ over $[0,\frac\pi2]$, so the answer is $\frac38\cdot\frac\pi2=\frac{3\pi}{16}$.

  (b) $I_n=nI_{n-1}$, $I_0=1$, so $I_4=4!=24$.'
remember: '**Even powers of $\sin$, $\cos$** → half-angle formulas. **$\int_0^\infty x^ne^{-x}=n!$** — memorise; with $e^{-ax}$ it is $\frac{n!}{a^{n+1}}$.'
hints:
- (a) Lower the power with $\sin^2x=\frac{1-\cos2x}2$. (b) Integrate by parts repeatedly.
- (a) $\sin^4x=\frac38-\frac12\cos2x+\frac18\cos4x$. (b) $I_n=\int_0^\infty x^ne^{-x}dx=nI_{n-1}$.
- Integration techniques — MIT Матан 07 · Integration *(ссылка в исходном vault)*; the Gamma function $\Gamma(n+1)=n!$.
