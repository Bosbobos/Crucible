statement: Let $f$ be twice differentiable on $[0,2]$ with $f(0)=0$, $f(1)=1$, $f(2)=4$. Prove that $f''(c)=2$ for some $c\in(0,2)$.
solution: $g(x)=f(x)-x^2$ has $g(0)=g(1)=g(2)=0$. Rolle on $[0,1]$ and $[1,2]$ gives $c_1<c_2$ with $g'(c_1)=g'(c_2)=0$; Rolle for $g'$ on $[c_1,c_2]$ gives $c$ with $g''(c)=0$, i.e. $f''(c)=2$.
remember: '**$k+1$ zeros of $g$ → a zero of $g^{(k)}$.** Subtract the polynomial that interpolates the given values.'
hints:
- Subtract the obvious function with the same values and second derivative 2.
- $g=f-x^2$ vanishes at $0,1,2$. Apply Rolle twice.
- Rolle's theorem — MIT Матан 06 · Mean-value theorem *(ссылка в исходном vault)*.
