statement: Solve $y''+4y=\sin2x$, $y(0)=0$, $y'(0)=0$.
solution: '$y_p=-\frac x4\cos2x$ (check: $y_p''''+4y_p=\sin2x$). General: $y=C_1\cos2x+C_2\sin2x-\frac x4\cos2x$. From $y(0)=0$: $C_1=0$; $y''(0)=2C_2-\frac14=0$, $C_2=\frac18$. So $y=\frac18\sin2x-\frac x4\cos2x$ — the amplitude grows linearly.'
remember: '**Right side solves the homogeneous equation** (resonance) → multiply the guess by $x$ (by $x^2$ for a double root).'
hints:
- $\sin2x$ solves the homogeneous equation, so the usual guess fails — multiply it by $x$.
- Try $y_p=x(A\cos2x+B\sin2x)$; you get $A=-\frac14$, $B=0$.
- Resonance — the MIT ODE course, lecture 19.
