statement: 'A fair coin is tossed repeatedly.

  (a) Find the expected number of tosses until two heads in a row (HH) first appear.

  (b) Find the expected number of tosses until the pattern HT first appears.

  Explain why the answers differ.'
solution: '(a) From the equations: $e_1=1+\frac12e_0$, $e_0=2+e_1$, so $e_0=6$.

  (b) Reaching H takes on average 2 tosses; from state «H» we wait for a T, and an extra H does not reset us: another 2 on average. Total $4$.

  For HH a failure (T after H) throws us back to the start; for HT a failure (H after H) keeps the progress. Overlap of the pattern with itself makes it slower.'
remember: '**First-step analysis:** states = progress so far, one linear equation per state. Patterns that overlap themselves take longer to appear.'
hints:
- 'First-step analysis: define the expected remaining time from each «state» (how much of the pattern is already matched).'
- 'For HH: $e_0=1+\frac12e_1+\frac12e_0$, $e_1=1+\frac12\cdot0+\frac12e_0$. For HT: after H, a further H keeps you in state «H».'
- First-step analysis, Markov chains — Blitzstein–Hwang, 2.7, 11.
