statement: A fair coin is tossed until the pattern HTH appears for the first time. Find the expected number of tosses.
solution: 'From the equations: $e_\varnothing=2+e_H$, $e_H=2+e_{HT}$, $e_{HT}=1+\frac12e_\varnothing$. Then $e_\varnothing=4+1+\frac12e_\varnothing$, so $e_\varnothing=10$.'
remember: For a pattern, the state is **how much of the pattern is matched**; after a failure fall back to the longest suffix that is still a prefix. HTH overlaps itself, so it is slower than HTT (8).
hints:
- 'States = the longest suffix of the tosses so far that is a prefix of HTH: $\varnothing$, H, HT.'
- $e_\varnothing=1+\frac12e_H+\frac12e_\varnothing$, $e_H=1+\frac12e_H+\frac12e_{HT}$, $e_{HT}=1+\frac12\cdot0+\frac12e_\varnothing$ (after HT a T leaves nothing useful).
- First-step analysis — Blitzstein–Hwang, 2.7, 11.
