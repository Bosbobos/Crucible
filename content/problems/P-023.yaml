statement: Compute $\displaystyle\int\frac{dx}{x^2(x+1)}$.
solution: '$x=0$: $B=1$; $x=-1$: $C=1$; $x^2$: $A+C=0$, $A=-1$. So

  $$\int\frac{dx}{x^2(x+1)}=-\ln|x|-\frac1x+\ln|x+1|+C.$$'
remember: '**Double root** → terms $\frac A{x-a}+\frac B{(x-a)^2}$. Constants: plug in the roots, then compare top coefficients. If $\deg P\ge\deg Q$, divide first.'
hints:
- 'The denominator has a double root at $0$: template $\frac Ax+\frac B{x^2}+\frac C{x+1}$.'
- '$1=Ax(x+1)+B(x+1)+Cx^2$: plug in $x=0$ and $x=-1$, then compare the $x^2$ coefficients.'
