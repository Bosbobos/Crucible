statement: Find the general solution of $y'\cos x+y\sin x=1$ on $\left(-\frac\pi2,\frac\pi2\right)$.
solution: '$\dfrac y{\cos x}=\tan x+C\Rightarrow y=\sin x+C\cos x$. Check: $y''\cos x+y\sin x=(\cos x-C\sin x)\cos x+(\sin x+C\cos x)\sin x=1$.'
remember: $\int\tan x\,dx=-\ln\cos x$, so $\mu=\frac1{\cos x}$. Always **check the answer** by substitution — it takes 30 seconds.
hints:
- Divide by $\cos x$ and find the integrating factor.
- $y'+y\tan x=\frac1{\cos x}$; $\mu=e^{\int\tan x}=\frac1{\cos x}$, so $\left(\frac y{\cos x}\right)'=\frac1{\cos^2x}$.
- 📘 Сначала — [ядро темы «Уравнения первого порядка»](study-material:vault-first-order). Integrating factor — Arnold, ODE, ch. 1.
