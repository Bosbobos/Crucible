statement: Find $\displaystyle\lim_{x\to0}\left(\frac1{\sin^2x}-\frac1{x^2}\right)$.
solution: $x^2-\sin^2x=\frac{x^4}3+o(x^4)$ and $x^2\sin^2x=x^4+o(x^4)$, so the limit is $\frac13$.
remember: '**$\infty-\infty$** → common denominator, then Taylor. To expand $\sin^2x$ square the expansion of $\sin x$ and keep the needed order.'
hints:
- Bring to a common denominator; the denominator behaves like $x^4$.
- $\dfrac{x^2-\sin^2x}{x^2\sin^2x}$; $\sin^2x=x^2-\frac{x^4}3+o(x^4)$.
- Taylor's formula — MIT Матан 09 · Taylor's formula *(ссылка в исходном vault)*.
