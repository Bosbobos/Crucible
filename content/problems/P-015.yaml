statement: Find $\displaystyle\lim_{x\to0}\frac{\sin x-x\cos x}{x^3}$.
solution: $\sin x-x\cos x=\left(-\frac16+\frac12\right)x^3+o(x^3)=\frac{x^3}3+o(x^3)$, so the limit is $\frac13$.
remember: '**$0/0$ with elementary functions** → expand to the first non-vanishing order of the denominator. Faster and safer than L''Hôpital three times.'
hints:
- Expand numerator up to $x^3$.
- $\sin x=x-\frac{x^3}6+o(x^3)$, $x\cos x=x-\frac{x^3}2+o(x^3)$.
- Taylor's formula with $o(x^n)$ — MIT Матан 09 · Taylor's formula *(ссылка в исходном vault)*.
