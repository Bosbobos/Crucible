statement: A fair die is rolled once, and then rolled again and again until a face different from the first one appears. Find the expected total number of rolls (including the first).
solution: 'The extra rolls form a geometric variable with $p=\frac56$, mean $\frac65$. Total: $1+\frac65=\frac{11}5$.'
remember: «Repeat until success with constant probability $p$» → geometric, mean $\frac1p$. Count separately what happens before the waiting starts.
hints:
- After the first roll, each new roll is a success with the same probability.
- The number of extra rolls is geometric with success probability $\frac56$.
- Geometric distribution — Blitzstein–Hwang, 4.3.
