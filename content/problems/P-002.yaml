statement: 'Three cards are in a hat: one is red on both sides, one is white on both sides, one is red on one side and white on the other. A card is drawn at random and placed on the table with a random side up. The visible side is red. What is the probability that the other side is also red?'
solution: 'Each of the 6 sides is equally likely to face up. Three of them are red: two belong to the red–red card, one to the red–white card. Given that a red side is up, the probability it belongs to the red–red card is $\frac23$.


  Via Bayes: $P(RR\mid \text{red up})=\dfrac{\frac13\cdot1}{\frac13\cdot1+\frac13\cdot\frac12}=\frac23$.'
remember: The natural guess $\frac12$ treats the two candidate cards as equally likely — but the red–red card is **twice as likely** to show red. Condition on what was actually observed.
hints:
- 'Count sides, not cards: the observation is «a red side is visible».'
- There are 3 red sides, equally likely to be the visible one. On how many of them is the other side red?
