statement: 'Let $X$ and $Y$ be independent with the exponential distribution of rate 1 (density $e^{-x}$ for $x\ge0$).

  (a) Find the density of $X+Y$.

  (b) Find the distribution of $\dfrac X{X+Y}$.'
solution: '(a) $f_{X+Y}(s)=\int_0^se^{-s}\,dx=se^{-s}$, $s\ge0$ (Gamma(2,1)).

  (b) For $0<t<1$, with $c=\frac t{1-t}$: $P(X\le cY)=\int_0^\infty e^{-y}(1-e^{-cy})\,dy=1-\frac1{1+c}=t$. So $\frac X{X+Y}$ is **uniform on $(0,1)$** (and, in fact, independent of $X+Y$).'
remember: '**Distribution of $g(X,Y)$** → write the CDF as the probability of a region and integrate the joint density. Sum of $n$ i.i.d. Exp(1) is Gamma($n$,1).'
hints:
- (a) Convolution. (b) Compute the CDF $P\left(\frac X{X+Y}\le t\right)$ and rewrite the event in terms of $X$ and $Y$.
- (a) $f(s)=\int_0^se^{-x}e^{-(s-x)}dx$. (b) $\frac X{X+Y}\le t\iff X\le\frac t{1-t}Y$; integrate over $Y$ first.
- Sums and transformations of continuous variables — Blitzstein–Hwang, 8.1–8.2, 8.4.
