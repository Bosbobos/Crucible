statement: Let $a_1,\dots,a_n\ne0$. Compute the determinant of the $n\times n$ matrix with entries $m_{ii}=1+a_i$ and $m_{ij}=1$ for $i\ne j$.
solution: '$\det(D+\mathbf1\mathbf1^\top)=\det D\cdot\det(I+D^{-1}\mathbf1\mathbf1^\top)=\prod a_i\left(1+\sum_i\frac1{a_i}\right)$, using $\det(I+uv^\top)=1+v^\top u$.

  Check: $a_i=1$ for all $i$ gives $n+1$ — the matrix of the diagnostic, problem 3.'
remember: '**Diagonal + constant** → $D+c\,\mathbf1\mathbf1^\top$; $\det(I+uv^\top)=1+v^\top u$. Check the formula on a special case.'
hints:
- 'The matrix is $D+\mathbf 1\mathbf 1^\top$ with $D=\operatorname{diag}(a_i)$: diagonal plus rank one.'
- '$\det(D+uv^\top)=\det D\,(1+v^\top D^{-1}u)$. Or: subtract the first row from the others and simplify.'
- Rank-one updates, matrix determinant lemma — Axler, ch. 10.
