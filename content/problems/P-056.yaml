statement: 'A real $3\times3$ matrix $A$ has eigenvalues $1$, $2$, $-1$.

  (a) Find $\det(A^2+I)$.

  (b) Find $\operatorname{tr}(A^3-A)$.

  (c) Find the eigenvalues of $A^{-1}$.'
solution: '$A$ has 3 distinct eigenvalues, so it is diagonalizable, and $p(A)$ has eigenvalues $p(\lambda_i)$.

  (a) $\det(A^2+I)=(1+1)(4+1)(1+1)=20$.

  (b) $\operatorname{tr}(A^3-A)=(1-1)+(8-2)+(-1+1)=6$.

  (c) $1,\frac12,-1$ ($A$ is invertible since $0$ is not an eigenvalue).'
remember: '**$p(A)$** has eigenvalues $p(\lambda_i)$; then $\det=\prod$, $\operatorname{tr}=\sum$. No need to know $A$ itself.'
hints:
- If $Av=\lambda v$, then $p(A)v=p(\lambda)v$ for any polynomial $p$.
- 'Eigenvalues of $A^2+I$: $2,5,2$; of $A^3-A$: $0,6,0$; of $A^{-1}$: $\frac1\lambda$.'
- Eigenvalues of polynomials in $A$ — Axler, ch. 5.
