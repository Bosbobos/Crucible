statement: A random permutation $a_1,\dots,a_n$ of $1,\dots,n$ is chosen. Position $k$ is a *record* if $a_k>a_i$ for all $i<k$ (position 1 is always a record). Find the expected number of records and its asymptotic behaviour as $n\to\infty$.
solution: $E=\sum_{k=1}^n\frac1k=H_n$. Since $\ln(n+1)\le H_n\le1+\ln n$ (compare with $\int\frac{dx}x$), $E\sim\ln n$.
remember: '**Symmetry:** among $k$ exchangeable values each is the maximum with probability $\frac1k$. Harmonic sums ↔ $\ln n$.'
hints:
- 'Indicators again: when is position $k$ a record?'
- Position $k$ is a record iff $a_k$ is the largest of $a_1,\dots,a_k$. By symmetry this has probability $\frac1k$.
