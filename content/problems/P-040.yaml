statement: A fair die is rolled 10 times. Find the expected number of distinct faces that appear.
solution: $E=6\left(1-\left(\frac56\right)^{10}\right)\approx5.03$.
remember: '**«Expected number of distinct …»** → indicator per possible value, probability via the complement «never».'
hints:
- 'Indicator for each face: does it appear at least once?'
- $P(\text{face }j\text{ never appears})=\left(\frac56\right)^{10}$.
