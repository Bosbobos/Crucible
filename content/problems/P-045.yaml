statement: Find the general solution of $x^2y''+3xy'+2y=0$ on $x>0$.
solution: '$r(r-1)+3r+2=r^2+2r+2=0$, $r=-1\pm i$. Real solutions: $y=\dfrac{C_1\cos(\ln x)+C_2\sin(\ln x)}x$.'
remember: '**Complex root $\alpha\pm i\beta$ of an Euler equation** → $x^\alpha\cos(\beta\ln x)$, $x^\alpha\sin(\beta\ln x)$: the Euler analogue of $e^{\alpha t}\cos\beta t$.'
hints:
- Try $y=x^r$, or substitute $x=e^t$.
- $r^2+2r+2=0$, $r=-1\pm i$; $x^{-1\pm i}=x^{-1}e^{\pm i\ln x}$.
- Euler equations — Arnold, ODE, ch. 3.
