statement: 'A family has two children; each child is a boy or a girl with probability $\frac12$, independently.

  (a) It is known that **at least one** of the children is a boy. Find the probability that both are boys.

  (b) It is known that the **elder** child is a boy. Find the probability that both are boys.'
solution: '(a) The condition leaves $\{BB, BG, GB\}$, all equally likely, so $P=\frac13$.

  (b) The condition leaves $\{BB, BG\}$, so $P=\frac12$.'
remember: '**«At least one»** keeps more outcomes than **«this particular one»**. When the condition says «at least», list the outcomes before computing.'
hints:
- Write down the sample space explicitly; the condition removes some outcomes.
- 'Equally likely outcomes: BB, BG, GB, GG (elder first). Which of them survive condition (a)? Condition (b)?'
- 📘 Сначала — [ядро темы «Условная вероятность и формула Байеса»](study-material:vault-bayes). Definition of conditional probability, $P(A\mid B)=P(A\cap B)/P(B)$ — Blitzstein–Hwang, 2.2.
