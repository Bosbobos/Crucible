statement: Urn A contains 3 white and 2 black balls; urn B contains 1 white and 4 black balls. A fair coin decides which urn to use, and one ball is drawn from it. The ball is white. What is the probability that it came from urn A?
solution: $P(A\mid W)=\dfrac{\frac12\cdot\frac35}{\frac12\cdot\frac35+\frac12\cdot\frac15}=\dfrac{3}{4}$.
remember: 'Equal priors cancel: the posterior odds equal the **likelihood ratio** $\frac{3/5}{1/5}=3:1$.'
hints:
- 'Bayes'' formula: the urn is the «cause», the colour is the observation.'
- $P(A\mid W)=\dfrac{P(W\mid A)P(A)}{P(W\mid A)P(A)+P(W\mid B)P(B)}$ with $P(W\mid A)=\frac35$, $P(W\mid B)=\frac15$.
- 📘 Сначала — [ядро темы «Условная вероятность и формула Байеса»](study-material:vault-bayes). Bayes' formula, law of total probability — Blitzstein–Hwang, 2.3.
