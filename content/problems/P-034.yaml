statement: Let $X,Y$ be independent standard normal. Find $P(X>2Y+1)$ in terms of the standard normal CDF $\Phi$.
solution: $X-2Y\sim N(0,5)$, hence $P(X-2Y>1)=1-\Phi\left(\frac1{\sqrt5}\right)\approx0.327$.
remember: '**Independent normals** → any linear combination is normal; variances add with squared coefficients. Then standardise.'
hints:
- $X-2Y$ is normal. With which mean and variance?
- $X-2Y\sim N(0,1+4)$, so $P(X-2Y>1)=P\left(Z>\frac1{\sqrt5}\right)$.
- Linear combinations of independent normals — Blitzstein–Hwang, 7.5.
