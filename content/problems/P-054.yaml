statement: Compute the determinant $D_n$ of the $n\times n$ matrix with $2$ on the diagonal, $-1$ on the two neighbouring diagonals and $0$ elsewhere.
solution: 'Expanding along the first row: $D_n=2D_{n-1}-(-1)(-1)D_{n-2}=2D_{n-1}-D_{n-2}$. With $D_1=2$, $D_2=3$ the solution of this linear recurrence is $D_n=n+1$ (check by induction).'
remember: '**Tridiagonal determinant** → expansion along the first row gives a two-term recurrence; compute a few values, guess, prove by induction.'
hints:
- Expand along the first row to get a recurrence.
- $D_n=2D_{n-1}-D_{n-2}$, $D_1=2$, $D_2=3$.
- Determinants, recurrences — Axler, ch. 10.
