statement: Let $f$ be continuous on $[a,b]$, differentiable on $(a,b)$, with $f(a)=f(b)=0$. Prove that there is $c\in(a,b)$ with $f'(c)=f(c)$.
solution: $g(x)=e^{-x}f(x)$ is continuous on $[a,b]$, differentiable on $(a,b)$, $g(a)=g(b)=0$. By Rolle there is $c$ with $0=g'(c)=e^{-c}(f'(c)-f(c))$, and $e^{-c}\ne0$.
remember: '**$f''=\lambda f$ at a point** → Rolle for $e^{-\lambda x}f(x)$. In general: guess $g$ so that $g''$ equals (nonzero factor) × (target expression).'
hints:
