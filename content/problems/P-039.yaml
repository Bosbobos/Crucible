statement: A standard 52-card deck is shuffled. Find the expected position of the first ace.
solution: For each non-ace, the indicator «it precedes all 4 aces» has probability $\frac15$ (it is equally likely to be anywhere among itself and the 4 aces). So the expected number of non-aces before the first ace is $\frac{48}5$, and the expected position is $1+\frac{48}5=\frac{53}5=10.6$.
remember: '**$k$ special items among $n$** → they cut the rest into $k+1$ gaps of equal expected size $\frac{n-k}{k+1}$. Indicators + symmetry.'
hints:
- The 4 aces split the 48 other cards into 5 groups. By symmetry, how many non-aces lie before the first ace on average?
- Each non-ace is equally likely to fall in any of the 5 gaps, so $E(\text{non-aces before the first ace})=\frac{48}5$.
- Symmetry, indicators — Blitzstein–Hwang, 4.4.
