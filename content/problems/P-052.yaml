statement: Prove that the equation $x^5-3x+1=0$ has at least three real roots.
solution: $f(-2)=-25<0$, $f(0)=1>0$, $f(1)=-1<0$, $f(2)=27>0$. By the IVT there is a root in each of $(-2,0)$, $(0,1)$, $(1,2)$.
remember: '**Count roots from below** → sign changes + IVT; **from above** → Rolle (between two roots of $f$ lies a root of $f''$).'
hints:
- Find sign changes at integer points.
- Evaluate at $x=-2,0,1,2$.
- Intermediate-value theorem — MIT Матан 05 · Intermediate-value theorem *(ссылка в исходном vault)*.
