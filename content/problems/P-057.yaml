statement: Let $A$ be a square matrix with $A^k=0$ for some $k\ge1$. Prove that every eigenvalue of $A$ is $0$ and that $I-A$ is invertible with $(I-A)^{-1}=I+A+\dots+A^{k-1}$.
solution: 'If $Av=\lambda v$, $v\ne0$, then $0=A^kv=\lambda^kv$, so $\lambda=0$. Telescoping: $(I-A)(I+A+\dots+A^{k-1})=I-A^k=I$, and the factors commute, so $I+A+\dots+A^{k-1}$ is the inverse.'
remember: '**Nilpotent $A$** → spectrum $\{0\}$; $(I-A)^{-1}$ is a finite geometric series. Same telescoping as $1+q+\dots+q^{k-1}=\frac{1-q^k}{1-q}$.'
hints:
- If $Av=\lambda v$, what is $A^kv$? For the inverse, multiply out.
- $0=A^kv=\lambda^kv$ with $v\ne0$. And $(I-A)(I+A+\dots+A^{k-1})=I-A^k$.
- Eigenvalues, nilpotent operators — Axler, ch. 5, 8.
