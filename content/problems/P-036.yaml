statement: 'A fair die is rolled; if it shows $N$, then $N$ fair coins are tossed. Let $H$ be the number of heads.

  (a) Find $E H$.

  (b) Find $\operatorname{Var}H$.'
solution: '(a) $E H=E\frac N2=\frac{3.5}2=\frac74$.

  (b) $\operatorname{Var}H=E\frac N4+\operatorname{Var}\frac N2=\frac{3.5}4+\frac14\cdot\frac{35}{12}=\frac{77}{48}\approx1.60$.'
remember: '**Two-stage randomness** → condition on the first stage: Adam''s law $E X=E[E[X\mid N]]$ and Eve''s law $\operatorname{Var}X=E\operatorname{Var}(X\mid N)+\operatorname{Var}E(X\mid N)$.'
hints:
- 'Condition on $N$: given $N=n$, $H$ is binomial.'
- $E[H\mid N]=\frac N2$, $\operatorname{Var}(H\mid N)=\frac N4$. Use $E H=E[E[H\mid N]]$ and $\operatorname{Var}H=E[\operatorname{Var}(H\mid N)]+\operatorname{Var}(E[H\mid N])$.
- Conditional expectation, law of total variance — Blitzstein–Hwang, 9.3, 9.5.
