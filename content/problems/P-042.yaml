statement: Find the general solution of $y''+y=x^2+e^x$.
solution: 'Homogeneous: $C_1\cos x+C_2\sin x$. For $x^2$: $y_p=x^2-2$ (since $2+x^2-2=x^2$). For $e^x$: $y_p=\frac12e^x$. So $y=C_1\cos x+C_2\sin x+x^2-2+\frac12e^x$.'
remember: '**Right side = polynomial / exponential / sine** → guess the same shape with unknown coefficients; by linearity treat each term separately.'
hints:
- General = homogeneous + particular. Look for a particular solution of the same shape as the right side, term by term.
- Try $y_p=Ax^2+Bx+C+De^x$ and compare coefficients.
- Method of undetermined coefficients — the MIT ODE course, lectures 15–17.
