statement: For $a>0$ and real $b$ compute $\displaystyle\int_{-\infty}^\infty e^{-ax^2+bx}\,dx$.
solution: $\displaystyle\int e^{-ax^2+bx}dx=e^{b^2/(4a)}\int e^{-a(x-b/(2a))^2}dx=e^{b^2/(4a)}\sqrt{\frac\pi a}$.
remember: '**Quadratic in the exponent** → complete the square: $\int e^{-ax^2+bx}=\sqrt{\frac\pi a}\,e^{b^2/(4a)}$. The same move gives the normal MGF.'
hints:
- Complete the square in the exponent.
- $-ax^2+bx=-a\left(x-\frac b{2a}\right)^2+\frac{b^2}{4a}$; then shift and scale.
- Gaussian integral — Spivak, ch. 19; moment generating function of the normal, Blitzstein–Hwang, 6.4.
