statement: Solve the initial value problem $y'+y=x$, $y(0)=0$.
solution: '$(ye^x)''=xe^x\Rightarrow ye^x=(x-1)e^x+C\Rightarrow y=x-1+Ce^{-x}$. From $y(0)=0$: $C=1$, so $y=x-1+e^{-x}$.'
remember: '**$y''+p(x)y=q(x)$** → multiply by $\mu=e^{\int p}$: the left side becomes $(\mu y)''$. General solution = particular + $Ce^{-\int p}$.'
hints:
- Multiply both sides by $e^x$. What does the left side become?
- $(y'+y)e^x=(ye^x)'$, so $(ye^x)'=xe^x$; integrate by parts.
- 📘 Сначала — [ядро темы «Уравнения первого порядка»](study-material:vault-first-order). Linear first-order equations, integrating factor — Arnold, ODE, ch. 1; the MIT ODE course, lectures 4–5.
