statement: Find all solutions of $y''+(y')^2=0$.
solution: 'With $p=y''$: $p''=-p^2$. Either $p\equiv0$, giving $y=C$, or $-\frac1p=-x-C_1$, $p=\frac1{x+C_1}$, giving $y=\ln|x+C_1|+C_2$.'
remember: '**No $y$ in the equation** → $p=y''$ lowers the order. **No $x$** → $p(y)=y''$, $y''''=p\frac{dp}{dy}$. Don''t lose the solutions where you divided by zero.'
hints:
- '$y$ itself does not appear: put $p=y''$.'
- '$p''=-p^2$ is separable: $p=\frac1{x+C_1}$ or $p\equiv0$.'
- Reduction of order — Arnold, ODE, ch. 2.
