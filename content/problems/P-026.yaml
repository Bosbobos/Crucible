statement: Among 10 coins one has heads on both sides; the other 9 are fair. A coin is chosen at random and tossed 3 times; all three tosses show heads. What is the probability that the chosen coin is the two-headed one?
solution: $P=\dfrac{\frac1{10}\cdot1}{\frac1{10}\cdot1+\frac9{10}\cdot\frac18}=\dfrac{8}{17}\approx0.47$.
remember: '**Prior × likelihood**, then normalise. Each extra head doubles the odds in favour of the two-headed coin.'
hints:
- Bayes again; the observation is «3 heads in a row».
- 'Likelihoods: $1$ for the two-headed coin, $\left(\frac12\right)^3$ for a fair one. Priors $\frac1{10}$ and $\frac9{10}$.'
