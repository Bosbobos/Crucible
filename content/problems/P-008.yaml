statement: Two players take turns rolling a fair die; the first player rolls first. The first one to roll a six wins. Find the probability that the first player wins.
solution: 'Either the first player wins immediately ($\frac16$), or both miss ($\frac{25}{36}$) and the game starts over. So $p=\frac16+\frac{25}{36}p$, $p=\frac{6}{11}$.

  (Or sum the series $\frac16\sum_{k\ge0}\left(\frac{25}{36}\right)^k$.)'
remember: '**Self-similar game:** after a round with no result the situation repeats — write one equation for the unknown probability.'
hints:
- 'Condition on the first round: either someone wins now or the game restarts in the same state.'
- $p=\frac16+\frac56\cdot\frac56\,p$.
- Geometric series / first-step analysis — Blitzstein–Hwang, 2.7.
