statement: Find the general solution of $x^2y''-2xy'+2y=0$ on $x>0$.
solution: $r=1,2$, so $y=C_1x+C_2x^2$. (Equivalently, $x=e^t$ turns it into $\ddot y-3\dot y+2y=0$.)
remember: '**$x^2y''''+axy''+by=0$** → $y=x^r$, $r(r-1)+ar+b=0$; or substitute $x=e^t$ to get constant coefficients.'
hints:
- 'Coefficients are powers of $x$ matching the order of the derivative: try $y=x^r$.'
- $r(r-1)-2r+2=0$, i.e. $r^2-3r+2=0$.
- Euler equations — Arnold, ODE, ch. 3.
