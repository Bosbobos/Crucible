statement: A stick of length 1 is broken at two points chosen independently and uniformly. Find the probability that the three pieces form a triangle.
solution: In the triangle $0<u<v<1$ (area $\frac12$) the conditions $u<\frac12$, $v-u<\frac12$, $v>\frac12$ cut out the triangle with vertices $(0,\frac12)$, $(\frac12,\frac12)$, $(\frac12,1)$ of area $\frac18$. So $P=\frac{1/8}{1/2}=\frac14$.
remember: '**Triangle from pieces of a unit length** ⇔ every piece $<\frac12$. Order the break points to get a simple region.'
hints:
- 'Triangle inequality: every piece must be shorter than $\frac12$.'
- With $u<v$ the break points, the pieces are $u$, $v-u$, $1-v$. Draw the region in the triangle $0<u<v<1$.
- Geometric probability — Blitzstein–Hwang, 7.1.
