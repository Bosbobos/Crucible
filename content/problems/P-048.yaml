statement: Find the derivative of $f(x)=x^{\sin x}$, $x>0$.
solution: $f'(x)=x^{\sin x}\left(\cos x\ln x+\dfrac{\sin x}x\right)$.
remember: '**$u(x)^{v(x)}$** → $e^{v\ln u}$; derivative $= u^v\left(v''\ln u+v\frac{u''}u\right)$. Neither the power rule nor the exponential rule alone.'
hints:
- Rewrite as an exponential.
- $x^{\sin x}=e^{\sin x\ln x}$; differentiate the exponent by the product rule.
- Real exponents, $a^x=e^{x\log a}$ — MIT Матан 07 · Exponentials *(ссылка в исходном vault)*.
