statement: 'Let $u,v\in\mathbb R^n$, $n\ge2$.

  (a) Find the eigenvalues of $uu^\top$ with multiplicities.

  (b) Find the eigenvalues of $A=I+uv^\top$ and $\det A$.

  (c) If $1+v^\top u\ne0$, show that $A^{-1}=I-\dfrac{uv^\top}{1+v^\top u}$.'
solution: '(a) $uu^\top$: $0$ with multiplicity $n-1$ (the hyperplane $u^\perp$) and $\|u\|^2$ (eigenvector $u$).

  (b) $uv^\top$ has eigenvalues $0$ (multiplicity $n-1$) and $v^\top u$ (trace), so $A$ has $1$ ($n-1$ times) and $1+v^\top u$; $\det A=1+v^\top u$.

  (c) $(I+uv^\top)\left(I-\frac{uv^\top}{1+v^\top u}\right)=I+uv^\top-\frac{uv^\top+u(v^\top u)v^\top}{1+v^\top u}=I+uv^\top-uv^\top=I$.'
remember: '**Rank one:** eigenvalue $0$ on a hyperplane, the remaining one equals the **trace**. $I+uv^\top$ shifts everything by 1.'
hints:
- 'A rank-one matrix kills a whole hyperplane: which vectors does $uv^\top$ send to $0$?'
- '$uv^\top x=(v^\top x)u$: every $x\perp v$ is an eigenvector with eigenvalue 0, and $u$ is an eigenvector with eigenvalue $v^\top u$.'
- Eigenvalues, rank — Axler, ch. 5; Sherman–Morrison formula.
