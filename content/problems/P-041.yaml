statement: 'Find the general solution:

  (a) $y''''-5y''+6y=0$;

  (b) $y''''+2y''+5y=0$;

  (c) $y''''-4y''+4y=0$.'
solution: '(a) $r^2-5r+6=0$, $r=2,3$: $y=C_1e^{2x}+C_2e^{3x}$.

  (b) $r=-1\pm2i$: $y=e^{-x}(C_1\cos2x+C_2\sin2x)$.

  (c) $r=2$ (double): $y=(C_1+C_2x)e^{2x}$.'
remember: '**$ay''''+by''+cy=0$** → roots of $ar^2+br+c$: real distinct / complex / double — three formulas to know by heart.'
hints:
- 'Try $y=e^{rx}$: you get the characteristic equation $r^2+br+c=0$.'
- Two real roots → two exponentials; complex roots $\alpha\pm i\beta$ → $e^{\alpha x}\cos\beta x$, $e^{\alpha x}\sin\beta x$; a double root $r$ → $e^{rx}$, $xe^{rx}$.
- Linear equations with constant coefficients — Hirsch–Smale, ch. 3; the MIT ODE course, lecture 13.
