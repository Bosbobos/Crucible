statement: Find the Taylor expansion of $e^{\sin x}$ at $x=0$ up to $o(x^3)$.
solution: $e^{\sin x}=1+\left(x-\frac{x^3}6\right)+\frac{x^2}2+\frac{x^3}6+o(x^3)=1+x+\frac{x^2}2+o(x^3)$ — the $x^3$ terms cancel.
remember: '**Expansion of $f(g(x))$** → expand the inner function, plug into the outer one, and track **only the needed order**; check for cancellations.'
hints:
- Substitute $u=\sin x=x-\frac{x^3}6+o(x^3)$ into $e^u=1+u+\frac{u^2}2+\frac{u^3}6+o(u^3)$.
- 'Keep only terms up to $x^3$: $u^2=x^2+o(x^3)$, $u^3=x^3+o(x^3)$.'
- Taylor's formula with $o(x^n)$ — MIT Матан 09 · Taylor's formula *(ссылка в исходном vault)*.
