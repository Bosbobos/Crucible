statement: $n$ people put their hats in a box; then each person takes a hat at random (all $n!$ assignments are equally likely). Let $X$ be the number of people who get their own hat. Find (a) $E X$ and (b) $\operatorname{Var}X$.
solution: '$E X=\sum_k E I_k=n\cdot\frac1n=1$.

  $E X^2=\sum_k E I_k+\sum_{j\ne k}E[I_jI_k]=1+n(n-1)\cdot\frac1{n(n-1)}=2$, so $\operatorname{Var}X=2-1=1$ (for $n\ge2$).'
remember: «Expected number of …» → **sum of indicators**; linearity works even though the indicators are dependent. For the variance add the pair terms $E[I_jI_k]$.
hints:
- Write $X$ as a sum of indicators.
- $X=\sum I_k$, $I_k=1$ if person $k$ gets their own hat. $E I_k=\frac1n$; for $j\ne k$, $E[I_jI_k]=\frac1{n(n-1)}$.
