statement: 'A disease affects 1% of the population. A test detects it in 95% of sick people and gives a false positive in 5% of healthy people.

  (a) A person tests positive. What is the probability that they are sick?

  (b) The same person takes a second, independent test of the same kind, and it is also positive. What is the probability now?'
solution: '(a) $P=\dfrac{0.0095}{0.0095+0.0495}=\dfrac{95}{590}\approx0.161$.

  (b) $P=\dfrac{0.95^2\cdot0.01}{0.95^2\cdot0.01+0.05^2\cdot0.99}=\dfrac{0.009025}{0.0115}\approx0.785$.

  (Equivalently: use the answer of (a) as the new prior and apply Bayes once more.)'
remember: 'With a rare condition, most positives are **false positives**: the base rate dominates. A posterior can be reused as the next prior.'
hints:
- Bayes' formula with the total probability of a positive result in the denominator.
- $P(\text{sick}\mid +)=\dfrac{0.95\cdot0.01}{0.95\cdot0.01+0.05\cdot0.99}$. For (b), two positives have likelihoods $0.95^2$ and $0.05^2$.
