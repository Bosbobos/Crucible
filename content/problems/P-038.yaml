statement: Five people are chosen at random; each is equally likely to be born in any of the 12 months, independently. Find the probability that all five are born in different months.
solution: $P=\dfrac{12\cdot11\cdot10\cdot9\cdot8}{12^5}=\dfrac{95040}{248832}\approx0.382$.
remember: '**«All different»** → falling factorial over the total; for «at least two coincide» take the complement.'
hints:
- 'Count ordered outcomes: total $12^5$.'
- 'Favourable: $12\cdot11\cdot10\cdot9\cdot8$.'
- Counting, birthday problem — Blitzstein–Hwang, 1.4.
