statement: Find all solutions of $y'=\dfrac{x^2+y^2}{xy}$ on $x>0$.
solution: 'With $y=xv$: $xv''=\frac1v$, so $v\,dv=\frac{dx}x$, $\frac{v^2}2=\ln x+C$. Hence $y^2=2x^2\ln x+Cx^2$, i.e. $y=\pm x\sqrt{2\ln x+C}$ where the root is defined.'
remember: '**$y''=f(y/x)$** → $y=xv$ turns it into a separable equation for $v$.'
hints:
- The right side depends only on $\frac yx$. Substitute $y=xv$.
- $v+xv'=\frac1v+v$, i.e. $vv'=\frac1x$.
- 📘 Сначала — [ядро темы «Уравнения первого порядка»](study-material:vault-first-order). Homogeneous equations $y'=f(y/x)$ — Arnold, ODE, ch. 1.
