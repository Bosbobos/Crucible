statement: 'A gambler has 2 dollars. At each step a fair coin is tossed: heads — he wins 1 dollar, tails — he loses 1 dollar. He stops when he has 0 or 5 dollars.

  (a) Find the probability that he ends with 5 dollars.

  (b) Find the expected number of tosses.'
solution: '(a) $p_k$ is linear in $k$ with $p_0=0$, $p_5=1$, so $p_k=\frac k5$ and $p_2=\frac25$.

  (b) $e_k=k(5-k)$ satisfies $e_k=1+\frac12(e_{k-1}+e_{k+1})$ (the second difference of $k(5-k)$ is $-2$) and the boundary conditions; so $e_2=6$.'
remember: '**Fair random walk** between $0$ and $N$ from $k$: wins with probability $\frac kN$, lasts $k(N-k)$ steps on average. Derivation: one equation per state.'
hints:
- 'First-step analysis: let $p_k$ (resp. $e_k$) be the answer starting from $k$ dollars, $0\le k\le5$.'
- '$p_k=\frac12p_{k-1}+\frac12p_{k+1}$ with $p_0=0$, $p_5=1$: $p_k$ is linear. $e_k=1+\frac12e_{k-1}+\frac12e_{k+1}$, $e_0=e_5=0$: $e_k$ is quadratic.'
- First-step analysis, gambler's ruin — Blitzstein–Hwang, 2.7.
