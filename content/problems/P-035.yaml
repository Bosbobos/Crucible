statement: 'Let $X,Y$ be independent standard normal and $R=\sqrt{X^2+Y^2}$.

  (a) Find $P(R\le r)$ for $r>0$.

  (b) Find $E R$.'
solution: '(a) $P(R\le r)=\int_0^re^{-\rho^2/2}\rho\,d\rho=1-e^{-r^2/2}$.

  (b) Density of $R$ is $\rho e^{-\rho^2/2}$; $E R=\int_0^\infty\rho^2e^{-\rho^2/2}\,d\rho=\frac12\sqrt{2\pi}=\sqrt{\frac\pi2}$.'
remember: '**Rotation-invariant density** → polar coordinates; the factor $\rho$ from the Jacobian makes the integral elementary. Same trick computes $\int e^{-x^2}=\sqrt\pi$.'
hints:
- 'The joint density $\frac1{2\pi}e^{-(x^2+y^2)/2}$ depends only on the radius: use polar coordinates.'
- $P(R\le r)=\int_0^{2\pi}\!\int_0^r\frac1{2\pi}e^{-\rho^2/2}\rho\,d\rho\,d\varphi$.
- Polar coordinates, multivariate normal — Blitzstein–Hwang, 7.5, 8.1.
