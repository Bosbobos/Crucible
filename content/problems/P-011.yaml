statement: Find all solutions of $xy'+2y=x^2$ on $x>0$.
solution: $(x^2y)'=x^3\Rightarrow x^2y=\frac{x^4}4+C\Rightarrow y=\frac{x^2}4+\frac C{x^2}$.
remember: 'Before searching for $\mu$, look whether the left side is already a derivative: $xy''+2y=\frac1x(x^2y)''$.'
hints:
- Bring it to the form $y'+p(x)y=q(x)$ and find $\mu=e^{\int p}$.
- '$y''+\frac2xy=x$, $\mu=x^2$: $(x^2y)''=x^3$.'
- 📘 Сначала — [ядро темы «Уравнения первого порядка»](study-material:vault-first-order). Integrating factor — Arnold, ODE, ch. 1.
