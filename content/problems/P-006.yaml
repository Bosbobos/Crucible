statement: A fair die is rolled until each of the faces $1,\dots,6$ has appeared at least once. Find the expected number of rolls.
solution: $E=\sum_{k=0}^5\frac6{6-k}=6\left(1+\frac12+\frac13+\frac14+\frac15+\frac16\right)=6H_6=14.7$.
remember: '**Coupon collector:** cut a waiting process into stages with constant success probability; each stage is geometric, and expectations add.'
hints:
- 'Split the waiting time into stages: the time to get a new face when $k$ distinct faces are already seen.'
- When $k$ faces have been seen, each roll gives a new face with probability $\frac{6-k}6$, so the stage length is geometric with mean $\frac6{6-k}$.
