statement: Find $\displaystyle\lim_{x\to0}(\cos x)^{1/x^2}$.
solution: $\dfrac{\ln\cos x}{x^2}\to-\frac12$, so the limit is $e^{-1/2}=\frac1{\sqrt e}$.
remember: '**$1^\infty$** → $f^g=e^{g\ln f}$, and $\ln(1+u)\approx u$. The answer is $e^{\lim g(f-1)}$.'
hints:
- 'Take the logarithm: $(\cos x)^{1/x^2}=e^{\ln(\cos x)/x^2}$.'
- $\ln\cos x=\ln\left(1-\frac{x^2}2+o(x^2)\right)=-\frac{x^2}2+o(x^2)$.
- Taylor's formula, $\ln(1+u)=u+o(u)$ — MIT Матан 09 · Taylor's formula *(ссылка в исходном vault)*.
