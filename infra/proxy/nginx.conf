pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 error_log /dev/stderr warn;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=2s ipv6=off;
  resolver_timeout 2s;
  set $content_host content:8000;
  set $practice_host practice:8000;
  set $learning_host learning:8000;
  set $reports_host reports:8000;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
  location = /hello { return 200 '{"message":"Crucible"}'; add_header Content-Type application/json; }
  location /internal/ { return 404; }
  location /docs { return 404; }
  location = /api/v1/practice/auth/login { proxy_pass http://$practice_host$request_uri; proxy_set_header X-Session-Assertion ""; }
  location = /_auth {
   internal;
   # Bearer identity is verified locally by the destination service. It must not
   # acquire a runtime dependency on practice session introspection.
   if ($http_authorization ~ "^Bearer ") { return 204; }
   proxy_pass http://$practice_host/internal/auth/check;
   proxy_pass_request_body off;
   proxy_set_header Content-Length "";
   proxy_set_header X-Original-URI $request_uri;
   proxy_set_header X-Original-Method $request_method;
  }
  location /api/v1/content/ {
   auth_request /_auth;
   auth_request_set $assertion $upstream_http_x_session_assertion;
   proxy_set_header X-Session-Assertion $assertion;
   proxy_pass http://$content_host$request_uri;
  }
  location /api/v1/practice/ {
   auth_request /_auth;
   auth_request_set $assertion $upstream_http_x_session_assertion;
   proxy_set_header X-Session-Assertion $assertion;
   proxy_pass http://$practice_host$request_uri;
  }
  location /api/v1/learning/ {
   auth_request /_auth;
   auth_request_set $assertion $upstream_http_x_session_assertion;
   proxy_set_header X-Session-Assertion $assertion;
   proxy_pass http://$learning_host$request_uri;
  }
  location /api/v1/reports/ {
   auth_request /_auth;
   auth_request_set $assertion $upstream_http_x_session_assertion;
   proxy_set_header X-Session-Assertion $assertion;
   proxy_pass http://$reports_host$request_uri;
  }
  location /api/ { return 404; }
  location / { try_files $uri /index.html; }
 }
}
